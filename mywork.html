    <main>
        <article class="api-app">
            <header>
                <h2>Ninja API APP</h2>
            </header>
            <form action="#" method="post">
                <fieldset>
                    <h3>Pick from the following API's</h3>
                    <div id="api-checkboxes">
                        <label>
                            <input type="checkbox" class="api-checkbox" id="sudoku" value="sudoku" checked />
                            Sudoku
                        </label>
                        <label>
                            <input type="checkbox" class="api-checkbox" id="cocktail" value="cocktail" />
                            Cocktail
                        </label>
                    </div>
                </fieldset>
                <fieldset id="api-input-fieldset">
                    <input type="text" id="api-input" placeholder="Enter your input here..." />
                    <button type="submit" id="api-submit">Get Response</button>
                </fieldset>
                <fieldset>
                    <h3>Here is the result!</h3>
                    <div id="api-result">
                        <p>
                            Your result will appear here...
                        </p>
                    </div>

                                    <td class="cell" data-col="7"></td>
                                    <td class="cell" data-col="8"></td>
                                </tr>
                                <tr class="row" data-row="2">
                                    <td class="cell" data-col="0"></td>
                                    <td class="cell" data-col="1"></td>
                                    <td class="cell" data-col="2"></td>

                        <p class="message"></p>
                    </template>
            
                    <template id="sudoku-selectable-cell-template">
                        <select class="cell-displayer selectable" data-solution="">
                            <option selected value="0">?</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                        </select>
                    </template>
            
                    <template id="sudoku-filled-cell-template">
                        <p class="cell-displayer filled"></p>
                    </template>
            
                    <template id="cocktail-template">
                        <section class="cocktail-section">
                            <header>
                                <h3 class="cocktail-name"></h3>
